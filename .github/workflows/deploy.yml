name: Test and deploy

# Push to dev runs lint + SAST + dependency audit + the test suite (QA on Railway deploys
# a dev commit only after these pass). Production deploys run ONLY on a push to main, and
# only after the same three gates pass (owner rule, 12 Nov: production from main, through
# CI, never by hand). The QA pass that
# preceded this gate caught two regressions that had already shipped to
# production (PR #27, PR #28). The whole point of `needs:` is to make sure
# that can't happen again.

on:
  push:
    branches:
      - dev
      # main takes merge PRs from dev only (main-source.yml); the push that merge makes is
      # the only event that may deploy production (job `deploy` below).
      - main
      # Feature branches got NO CI at all, so the only way to learn that a
      # change broke lint, the suite or the Postgres concurrency check was to
      # push it to dev -- which is also the branch that deploys. The gates are
      # worth more before that point than after it.
      #
      # The deploy job is gated on `github.ref == 'refs/heads/dev'` AND
      # `github.event_name == 'push'`, so running on a feature branch builds
      # and tests but cannot deploy anything.
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - dev
  workflow_dispatch:

# Don't run more than one deploy at a time on the same branch; queue them
# so the second push waits for the first to settle.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: validate / lint, SAST, dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install tooling
        run: pip install ruff bandit pip-audit

      - name: Ruff (lint)
        run: ruff check .

      - name: Bandit (SAST)
        # Reports medium severity and above. Migrations and tests are
        # excluded: generated code and asserts are not findings.
        run: bandit -r base servers integrations -ll --exclude "*/migrations/*"

      - name: pip-audit (known CVEs in dependencies)
        # Non-blocking for now: cashfree-pg pins pydantic <2, which drags in
        # transitive advisories we cannot resolve without dropping the SDK.
        # Tracked separately — the report still surfaces on every PR so a
        # NEW advisory is visible immediately.
        continue-on-error: true
        run: pip-audit -r requirements.txt

  test:
    name: validate / test suite
    runs-on: ubuntu-latest
    # The suite takes 6-7 min and runs slower on a PR's merge commit while the
    # push run of the same SHA is going; at 10 min the PR run hit the timeout
    # (GitHub reports that as "cancelled") on #79 and #81. 25 leaves headroom.
    # The suite takes about 24 minutes now; at 25 a slow runner cancels it
    # (run 41563435325 was cancelled at 25m03s on a green commit).
    timeout-minutes: 40

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==8.1.1 pytest-django==4.8.0 pytest-asyncio==0.21.1

      - name: Check for missing migrations
        # A model change merged without its migration breaks the next
        # deploy, at which point the fix gets written under pressure.
        env:
          DJANGO_SECRET_KEY: ci-test-secret-not-for-prod
          ALLOWED_HOSTS: localhost,127.0.0.1,testserver
          DEBUG_ENV: 'True'
          REDIS_URL: redis://localhost:6379
          DJANGO_SETTINGS_MODULE: base.settings
        run: python manage.py makemigrations --check --dry-run

      - name: Run pytest
        # The canonical backend test command. Deliberately bare: `pytest`
        # reads pytest.ini, which sets DJANGO_SETTINGS_MODULE=base.settings_ci
        # and points `testpaths` at BOTH `tests/` and `servers/`. This step
        # previously ran `pytest tests/ -q`, which silently excluded every
        # test under `servers/**/tests/`.
        #
        # No `env:` block on purpose. The test-only values that used to live
        # here now live in base/settings_ci.py, so a developer running
        # `pytest` locally gets the identical configuration instead of having
        # to export six variables. Setting DJANGO_SETTINGS_MODULE here would
        # override pytest.ini and split the two paths apart again.
        run: pytest

  postgres-concurrency:
    name: validate / postgres concurrency
    # Row-lock contention tests only. The `test` job above stays on SQLite and
    # is unchanged; SELECT FOR UPDATE is a no-op there, so the one-driver-one-
    # trip invariant cannot be proven by it. These tests are opted into by
    # marker, so this job and the default `pytest` never overlap.
    #
    # PostgreSQL 15 on purpose, not the 18 that Railway QA happens to run:
    # docker-compose.override.yml pins postgres:15-alpine for local dev,
    # production is RDS at an unconfirmed version, and Django 5.0 supports
    # 12+. Testing on the lowest version anyone runs is the conservative
    # choice, and nothing here depends on post-15 behaviour — row locking and
    # READ COMMITTED have been stable for many major versions.
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: sgtest
          POSTGRES_USER: sgtest
          POSTGRES_PASSWORD: sgtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==8.1.1 pytest-django==4.8.0 pytest-asyncio==0.21.1

      - name: Run PostgreSQL concurrency tests
        # Reuses the existing DB_* configuration in base/settings.py rather
        # than introducing a second settings architecture: setting DB_HOST is
        # all it takes to switch off the SQLite fallback. DB_SSLMODE=disable
        # because the service container speaks plaintext, and the app default
        # is `require`.
        #
        # ONE PROCESS for everything except one file. This used to be one
        # process per file, across ten files, because the cross-file
        # interference was unexplained. It has now been root-caused.
        #
        # The cause was NOT what the old comment here guessed. It was the
        # Channels channel layer: `channels.layers.channel_layers` caches one
        # RedisChannelLayer per alias for the life of the process, and a
        # RedisChannelLayer binds its connections and pending futures to
        # whichever event loop first touched it. Every async test gets a fresh
        # loop, so the second async test in a process inherited a layer wired to
        # the first test's dead loop and channels_redis raised "Two event loops
        # are trying to receive() on one channel layer at once!". Consumer tasks
        # outliving their test (LocationBroadcastMixin._location_pump sitting in
        # `await queue.get()`) made it worse by keeping a receive() outstanding
        # against the shared layer.
        #
        # The root conftest.py now clears that cache around every test. In a
        # single process this took the suite from 22 failures to 1.
        #
        # The remaining 1 is test_lifecycle_under_gps_load.py's
        # test_the_driver_does_not_receive_its_own_location_echo, which still
        # fails when that file runs after test_driver_active_trip_contention.py
        # -- reproducible in ~100s with just those two files, which is a lot
        # better than "only in the full suite". Its active-trip key is deleted
        # between a confirmed SET and an immediate GET in the same thread, so
        # something outside the test is clearing it; the file passes on its own
        # (27 passed). Until that is closed, this one file gets its own process
        # rather than the whole suite paying for it.
        #
        # `-p no:cacheprovider` keeps the two processes from fighting over
        # .pytest_cache.
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: sgtest
          DB_USER: sgtest
          DB_PASSWORD: sgtest
          DB_SSLMODE: disable
        run: |
          set -uo pipefail
          status=0

          # The one file with an open cross-file interaction, on its own.
          QUARANTINED=tests/test_lifecycle_under_gps_load.py

          echo "::group::$QUARANTINED (separate process)"
          pytest "$QUARANTINED" -m postgres -q -p no:cacheprovider || status=1
          echo "::endgroup::"

          echo "::group::all other postgres-marked tests (one process)"
          pytest -m postgres -q -p no:cacheprovider --reuse-db             --ignore="$QUARANTINED" || status=1
          echo "::endgroup::"

          exit $status

  # OPTIONAL. Separate from the three `validate` jobs above on purpose.
  #
  # THE PRESENTATION PROBLEM THIS FIXES
  # -----------------------------------
  # `dev` was red for four consecutive runs. In every one, lint, test and
  # postgres-concurrency PASSED and only this job failed, at "Setup SSH",
  # because EC2_SSH_KEY / EC2_HOST are not configured. The workflow's
  # conclusion is the worst of its jobs, so the branch showed a red X that
  # said "the code is broken" when it meant "the deploy target is not set
  # up". A permanently red default branch teaches people to stop reading CI,
  # which is how a real failure gets ignored.
  #
  # The distinction now drawn:
  #
  #   * secrets ABSENT   -> this job SKIPS, with a notice and a line in the
  #     run summary. Nothing is deployed and the run is green, because
  #     nothing about the application is wrong.
  #   * secrets PRESENT  -> every step runs and a failure is RED, exactly as
  #     before. A deploy that is configured and broken is a real failure.
  #
  # Nothing about the validation gates changes. `needs:` still requires all
  # three to pass before this job runs at all, so an unvalidated commit can
  # never reach EC2 -- that gate is not weakened, moved or made conditional.
  infra-validate:
    name: validate / terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The production stack is code (infra/production); every push checks it formats and validates.
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: fmt and validate
        working-directory: infra/production
        run: |
          terraform fmt -check -recursive || echo "::warning::infra/production is not terraform-fmt formatted"
          terraform init -backend=false -input=false
          terraform validate

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks over the commits this run introduces
        # Only NEW commits are scanned. The full history was scanned once by
        # hand and recorded (internal docs, AUDIT.md section 24.3); scanning it
        # on every run would fail forever on a key removed in 2026-09. The
        # allowlist in .gitleaks.toml names machine-generated files only.
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            RANGE="$HEAD~1..$HEAD"
          else
            RANGE="$BASE..$HEAD"
          fi
          echo "scanning $RANGE"
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.21.2             git /repo --config /repo/.gitleaks.toml --log-opts="$RANGE"             --redact --no-banner --exit-code 1

  deploy:
    name: deploy production (AWS ap-south-1)
    needs: [test, lint, postgres-concurrency, infra-validate]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Production deploys only from main, through CI, never by hand (owner rule, 12 Nov):
    #   - only a push to main (the merge of a dev -> main PR), never workflow_dispatch,
    #     a pull_request run or another branch;
    #   - only after lint, the suite and the Postgres check pass (`needs` above);
    #   - only once production is switched on on purpose: the repository variable
    #     PRODUCTION_DEPLOY_ENABLED is 'true' AND AWS_DEPLOY_ROLE_ARN is set. Setting one alone
    #     deploys nothing (the 2026-10-27 concern, AUDIT.md section 14).
    # 13 Nov: the target is the designed AWS stack (infra/production, Terraform), reached through
    # the GitHub OIDC role (infra/bootstrap/github-oidc.yml); no AWS key is stored anywhere.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    environment: production
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-south-1
      TF_VAR_image_tag: ${{ github.sha }}
      TF_VAR_certificate_validated: ${{ vars.PRODUCTION_CERT_VALIDATED == 'true' }}
      TF_VAR_alert_email: ${{ vars.PRODUCTION_ALERT_EMAIL }}
    steps:
      - name: Is the AWS role configured?
        id: preflight
        run: |
          if [ -z "${{ vars.AWS_DEPLOY_ROLE_ARN }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::AWS_DEPLOY_ROLE_ARN is not set (docs/config-required.md). Nothing was deployed."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.preflight.outputs.configured == 'true'

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.preflight.outputs.configured == 'true'
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Terraform state bucket and lock table (idempotent)
        if: steps.preflight.outputs.configured == 'true'
        run: |
          set -euo pipefail
          aws s3api head-bucket --bucket saaradhigo-prod-tfstate 2>/dev/null || {
            aws s3api create-bucket --bucket saaradhigo-prod-tfstate \
              --create-bucket-configuration LocationConstraint=ap-south-1
            aws s3api put-bucket-versioning --bucket saaradhigo-prod-tfstate \
              --versioning-configuration Status=Enabled
            aws s3api put-public-access-block --bucket saaradhigo-prod-tfstate \
              --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          }
          aws dynamodb describe-table --table-name saaradhigo-prod-tflock >/dev/null 2>&1 || \
            aws dynamodb create-table --table-name saaradhigo-prod-tflock \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH --billing-mode PAY_PER_REQUEST

      - uses: hashicorp/setup-terraform@v3
        if: steps.preflight.outputs.configured == 'true'
        with:
          terraform_version: 1.9.8

      - name: Terraform apply (registries first, so the image has somewhere to go)
        if: steps.preflight.outputs.configured == 'true'
        working-directory: infra/production
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve -target=aws_ecr_repository.repo

      - name: Build and push the backend image
        if: steps.preflight.outputs.configured == 'true'
        run: |
          set -euo pipefail
          REGISTRY="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.ap-south-1.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          IMAGE="$REGISTRY/saaradhigo/backend:${GITHUB_SHA}"
          if aws ecr describe-images --repository-name saaradhigo/backend --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "image already pushed"
          else
            docker build -f dockerfile -t "$IMAGE" .
            docker push "$IMAGE"
          fi

      - name: Terraform apply (the whole stack, at this commit's image)
        if: steps.preflight.outputs.configured == 'true'
        working-directory: infra/production
        run: |
          # The web image tag is the last one the web repo pushed (its own production workflow).
          WEB_TAG=$(aws ssm get-parameter --name /saaradhigo/production/deploy/web_image_tag \
            --query Parameter.Value --output text 2>/dev/null || echo "")
          terraform apply -input=false -auto-approve -var "web_image_tag=${WEB_TAG:-none}"
          terraform output -json dns_records_for_godaddy > dns.json
          {
            echo "### DNS records for GoDaddy"
            jq -r '.[] | "- \(.type) \(.name) -> \(.value) (\(.why))"' dns.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Migrate (one-shot, on an app instance, with this commit's image)
        if: steps.preflight.outputs.configured == 'true'
        run: |
          set -euo pipefail
          REGISTRY="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.ap-south-1.amazonaws.com"
          IMAGE="$REGISTRY/saaradhigo/backend:${GITHUB_SHA}"
          for i in $(seq 1 40); do
            ID=$(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names saaradhigo-prod-app \
              --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`].InstanceId | [0]' --output text)
            [ "$ID" != "None" ] && [ -n "$ID" ] && break
            sleep 15
          done
          CMD=$(aws ssm send-command --instance-ids "$ID" --document-name AWS-RunShellScript \
            --parameters "commands=[\"aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin $REGISTRY\",\"docker run --rm --env-file /etc/saaradhigo.env $IMAGE python manage.py migrate --noinput\"]" \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$CMD" --instance-id "$ID"
          aws ssm get-command-invocation --command-id "$CMD" --instance-id "$ID" --query Status --output text
