<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaradhiGo WebSocket Test Suite</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 24px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { font-size: 24px; margin-bottom: 8px; color: #38bdf8; }
        p.subtitle { color: #94a3b8; margin-bottom: 20px; font-size: 14px; }
        .card { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #334155; }
        label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
        input, select, textarea { width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; font-size: 14px; margin-bottom: 12px; }
        textarea { height: 110px; font-family: monospace; }
        .btn-row { display: flex; gap: 10px; margin-top: 8px; }
        button { flex: 1; padding: 12px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; transition: all 0.2s; font-size: 14px; }
        .btn-connect { background: #10b981; color: white; }
        .btn-connect:hover { background: #059669; }
        .btn-disconnect { background: #ef4444; color: white; }
        .btn-disconnect:hover { background: #dc2626; }
        .btn-send { background: #3b82f6; color: white; }
        .btn-send:hover { background: #2563eb; }
        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-left: 10px; }
        .status-disconnected { background: #7f1d1d; color: #fca5a5; }
        .status-connected { background: #064e3b; color: #6ee7b7; }
        .logs { background: #020617; border-radius: 8px; padding: 14px; height: 260px; overflow-y: auto; font-family: monospace; font-size: 13px; border: 1px solid #1e293b; }
        .log-entry { margin-bottom: 8px; line-height: 1.4; word-break: break-all; }
        .log-in { color: #4ade80; }
        .log-out { color: #60a5fa; }
        .log-err { color: #f87171; }
        .log-info { color: #cbd5e1; }
    </style>
</head>
<body>
<div class="container">
    <h1>🚀 SaaradhiGo WebSocket Test Suite <span id="status" class="status-badge status-disconnected">Disconnected</span></h1>
    <p class="subtitle">Interactive client to test Rider, Driver, and Trip WebSockets</p>

    <div class="card">
        <label>1. JWT Access Token</label>
        <input type="text" id="token" placeholder="Paste your JWT access token here..." value="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0b2tlbl90eXBlIjoiYWNjZXNzIiwiZXhwIjoxNzg3MjI0ODI0LCJpYXQiOjE3ODcyMjM5MjQsImp0aSI6IjNmYzRiMzA0OGMwZjRiYmE4MGY0MTg4NjViOWFjYTMyIiwidXNlcl9pZCI6MSwiaXNzIjoic2FhcmFkaGlnbyJ9.Ng03QfTMlfDTilIFaMcu62If6pytXtPF_IOkPdyLI3M">

        <label>2. Endpoint Target</label>
        <select id="endpoint" onchange="updatePayloadPreset()">
            <option value="ws://127.0.0.1:8000/ws/ride/request/">Rider Request (/ws/ride/request/)</option>
            <option value="ws://127.0.0.1:8000/ws/driver/location/?lat=17.3850&lng=78.4867">Driver Location (/ws/driver/location/)</option>
            <option value="ws://127.0.0.1:8000/ws/ride/trip/1/">Trip Status (/ws/ride/trip/1/)</option>
            <option value="ws://127.0.0.1:8000/ws/ride/trip/1/chat/">Trip Chat (/ws/ride/trip/1/chat/)</option>
        </select>

        <div class="btn-row">
            <button class="btn-connect" onclick="connect()">Connect</button>
            <button class="btn-disconnect" onclick="disconnect()">Disconnect</button>
        </div>
    </div>

    <div class="card">
        <label>3. Send JSON Payload</label>
        <textarea id="payload"></textarea>
        <div class="btn-row">
            <button class="btn-send" onclick="sendPayload()">Send Message</button>
        </div>
    </div>

    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <label style="margin: 0;">4. Live Event Logs</label>
            <button style="flex: 0; padding: 4px 10px; font-size: 12px; background: #334155;" onclick="clearLogs()">Clear</button>
        </div>
        <div class="logs" id="logs"></div>
    </div>
</div>

<script>
    let socket = null;

    const presets = {
        "rider": JSON.stringify({
            "action": "request",
            "pickup_lat": 17.3850,
            "pickup_lng": 78.4867,
            "destination_lat": 17.4400,
            "destination_lng": 78.3480,
            "pickup_address": "Ameerpet Metro",
            "destination_address": "Hitech City",
            "distance_km": 10.5,
            "duration_min": 25.0,
            "vehicle_type": "sedan",
            "payment_method": "cash"
        }, null, 2),
        "driver": JSON.stringify({
            "lat": 17.3850,
            "lng": 78.4867
        }, null, 2),
        "trip": JSON.stringify({
            "action": "accept"
        }, null, 2),
        "chat": JSON.stringify({
            "action": "send",
            "body": "Hello from WebSocket test!"
        }, null, 2)
    };

    function updatePayloadPreset() {
        const val = document.getElementById('endpoint').value;
        if (val.includes('request')) document.getElementById('payload').value = presets.rider;
        else if (val.includes('location')) document.getElementById('payload').value = presets.driver;
        else if (val.includes('chat')) document.getElementById('payload').value = presets.chat;
        else document.getElementById('payload').value = presets.trip;
    }
    updatePayloadPreset();

    function log(msg, type='info') {
        const logs = document.getElementById('logs');
        const d = new Date().toLocaleTimeString();
        const div = document.createElement('div');
        div.className = `log-entry log-${type}`;
        div.textContent = `[${d}] ${msg}`;
        logs.appendChild(div);
        logs.scrollTop = logs.scrollHeight;
    }

    function clearLogs() {
        document.getElementById('logs').innerHTML = '';
    }

    function connect() {
        if (socket && socket.readyState === WebSocket.OPEN) {
            log('Already connected!', 'err');
            return;
        }

        const token = document.getElementById('token').value.trim();
        let url = document.getElementById('endpoint').value;
        const separator = url.includes('?') ? '&' : '?';
        url = `${url}${separator}token=${encodeURIComponent(token)}`;

        log(`Connecting to: ${url}`, 'info');
        try {
            socket = new WebSocket(url);

            socket.onopen = () => {
                document.getElementById('status').className = 'status-badge status-connected';
                document.getElementById('status').textContent = 'Connected';
                log('✅ Connected successfully to server!', 'in');
            };

            socket.onmessage = (event) => {
                log(`⬇️ RECV: ${event.data}`, 'in');
            };

            socket.onerror = (err) => {
                log(`❌ Error encountered`, 'err');
            };

            socket.onclose = (event) => {
                document.getElementById('status').className = 'status-badge status-disconnected';
                document.getElementById('status').textContent = 'Disconnected';
                log(`ℹ️ Closed (Code: ${event.code}, Reason: ${event.reason || 'Normal'})`, 'info');
            };
        } catch(e) {
            log(`❌ Exception: ${e.message}`, 'err');
        }
    }

    function disconnect() {
        if (socket) {
            socket.close();
            socket = null;
        }
    }

    function sendPayload() {
        if (!socket || socket.readyState !== WebSocket.OPEN) {
            log('❌ Cannot send: Not connected!', 'err');
            return;
        }
        const text = document.getElementById('payload').value;
        socket.send(text);
        log(`⬆️ SENT: ${text}`, 'out');
    }
</script>
</body>
</html>
