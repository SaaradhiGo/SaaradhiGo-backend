; Canonical backend test configuration.
;
; The whole backend suite runs with ONE command, locally and in CI:
;
;     pytest
;
; CI previously ran `pytest tests/`, which silently excluded every test
; under `servers/**/tests/`. That hid one real test
; (servers/admin_dashboard/tests/test_executive_revenue.py) and, more
; importantly, meant any test a developer added next to the app it covers
; would never run. `testpaths` below makes both roots first-class.
;
; WHAT IS IN THE BACKEND SUITE
;   tests/                     cross-app integration + security suites
;   servers/<app>/tests/       per-app unit tests, next to the code
;
; WHAT IS DELIBERATELY NOT IN IT
;   tests/cashfree_payout_rehearsal.py
;       A manual payout rehearsal script, not a test. It calls
;       django.setup() at import time and talks to Cashfree, so collecting
;       it would execute it. It matches neither `python_files` pattern, and
;       must keep a non-test filename for that reason.
;   */migrations/*             excluded via norecursedirs
;   staticfiles/               collected static output, never source
;   Frontend + mobile tests    they live in their own repos and runners
;       (SaaradhiGo-web, SaaradhiGo-mobile, SaaradhiGo-driver).
;   Two files skipped at collection time by tests/conftest.py
;       (test_settlement.py, test_upload_integration.py) — pre-existing QA
;       debt, each with a documented root cause in that file's comment.
;       They are NOT excluded here, so the reason stays in one place.

[pytest]
DJANGO_SETTINGS_MODULE = base.settings_ci

; Both test roots. Adding a path here is how a new suite joins CI.
testpaths =
    tests
    servers

python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

; Directories that can never contain tests. Skipping them keeps collection
; fast and makes it impossible to accidentally import a migration.
norecursedirs =
    .git
    .venv
    venv
    env
    __pycache__
    *.egg-info
    node_modules
    staticfiles
    media
    migrations

; -ra shows a short summary of skips/xfails so a test that stops running is
; visible instead of quietly vanishing from the count.
addopts = -ra --strict-markers

; Fail on an unregistered mark rather than silently no-op'ing it.
markers =
    slow: long-running test, safe to deselect locally
