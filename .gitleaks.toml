# gitleaks configuration for the CI secret scan.
#
# The scan runs over the commits a push or pull request INTRODUCES, not the
# whole history: the history was scanned once by hand and its findings are
# recorded in the internal docs (AUDIT.md §24.3). A full-history scan on every
# run would fail forever on a key that was committed and removed in 2026-09.
#
# The allowlist is deliberately tiny and names only MACHINE-GENERATED files:
#
#   contracts/*.json  -- API capture artefacts, regenerated by the contract
#                        tests on every run; they carry JWTs minted with the
#                        public CI test key, which are valid nowhere.
#   tests/fixtures/   -- golden files written by tests.
#
# No hand-written test is allowlisted. A fixture password or a fake key in a
# test file that already exists will not be re-flagged (only new commits are
# scanned); one introduced in a new commit will be, and that is the point.

title = "SaaradhiGo"

[extend]
useDefault = true

[allowlist]
description = "Machine-generated capture artefacts and golden files only"
paths = [
  '''^contracts/.*\.json$''',
  '''^tests/fixtures/.*''',
]
